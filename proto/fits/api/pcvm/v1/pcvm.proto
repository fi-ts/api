syntax = "proto3";

package fits.api.pcvm.v1;

import "buf/validate/validate.proto";
import "fits/api/v1/common.proto";
import "fits/api/v1/predefined_rules.proto";

// VMService provides VM operations.
service PublicCloudVMService {
  // Returns the VM with the specified UUID.
  rpc Get(PublicCloudVMServiceGetRequest) returns (PublicCloudVMServiceGetResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }

  // Creates a new VM.
  rpc Create(PublicCloudVMServiceCreateRequest) returns (PublicCloudVMServiceCreateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }

  // Returns the list of all VMs.
  rpc List(PublicCloudVMServiceListRequest) returns (PublicCloudVMServiceListResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }

  // Updates a VM.
  rpc Update(PublicCloudVMServiceUpdateRequest) returns (PublicCloudVMServiceUpdateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }

  // Deletes a VM immediately.
  rpc Delete(PublicCloudVMServiceDeleteRequest) returns (PublicCloudVMServiceDeleteResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }

  // Validates a VM create request without creating anything. Intended for
  // form pre-checks; the create endpoint validates again before executing.
  rpc ValidateCreate(PublicCloudVMServiceValidateCreateRequest) returns (PublicCloudVMServiceValidateCreateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }

  // Validates a VM update request without updating anything. Intended for
  // form pre-checks; the update endpoint validates again before executing.
  rpc ValidateUpdate(PublicCloudVMServiceValidateUpdateRequest) returns (PublicCloudVMServiceValidateUpdateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
}

// The VM resource.
message PublicCloudVM {
  // UUID of this VM.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Metadata for this VM including labels.
  fits.api.v1.Meta meta = 2;
  // Name of the VM.
  string name = 3 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // Tenant this VM belongs to.
  string tenant = 4 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // UUID of the project this VM belongs to.
  string project_uuid = 5 [(buf.validate.field).string.uuid = true];

  // Size of the VM.
  Size size = 6;

  // The status of the VM.
  Status status = 7;
}

// The Status of a VM.
message Status {
  // The state of the VM status.
  State state = 1;
  // The info details of the current state.
  string info = 2 [(buf.validate.field).string.(fits.api.v1.is_description) = true];

  // The current operation running on the VM.
  Operation operation = 3;
}

// The health state of the VM.
enum State {
  // STATE_UNSPECIFIED is not specified.
  STATE_UNSPECIFIED = 0 [(fits.api.v1.enum_string_value) = ""];
  // STATE_HEALTHY: the VM is healthy.
  STATE_HEALTHY = 1 [(fits.api.v1.enum_string_value) = "healthy"];
  // STATE_HEALTHY: there are some health warnings for this VM.
  STATE_WARNING = 2 [(fits.api.v1.enum_string_value) = "warning"];
  // STATE_ERROR: the VM is unhealthy.
  STATE_ERROR = 3 [(fits.api.v1.enum_string_value) = "error"];
}

// The operation of the VM.
enum Operation {
  // OPERATION_UNSPECIFIED is not specified.
  OPERATION_UNSPECIFIED = 0 [(fits.api.v1.enum_string_value) = ""];
  // OPERATION_CREATING: the VM hostname is reserved and provisioning has started.
  OPERATION_CREATING = 1 [(fits.api.v1.enum_string_value) = "creating"];
  // OPERATION_ACTIVE: the VM is active.
  OPERATION_ACTIVE = 2 [(fits.api.v1.enum_string_value) = "active"];
  // OPERATION_UPDATING: there is an ongoing operation for the VM.
  OPERATION_UPDATING = 3 [(fits.api.v1.enum_string_value) = "updating"];
  // OPERATION_DELETED: the VM is deleted.
  OPERATION_DELETED = 4 [(fits.api.v1.enum_string_value) = "deleted"];
  // OPERATION_ERROR: the
  OPERATION_ERROR = 5 [(fits.api.v1.enum_string_value) = "error"];
}

// Size specifies the size of the VM machine
enum Size {
  // SIZE_UNSPECIFIED is not specified.
  SIZE_UNSPECIFIED = 0 [(fits.api.v1.enum_string_value) = ""];
  // SIZE_SMALL: small machine size.
  SIZE_SMALL = 1 [(fits.api.v1.enum_string_value) = "small"];
  // SIZE_MEDIUM: medium machine size.
  SIZE_MEDIUM = 2 [(fits.api.v1.enum_string_value) = "medium"];
  // SIZE_LARGE: large machine size.
  SIZE_LARGE = 3 [(fits.api.v1.enum_string_value) = "large"];
}

// The VM query parameters to filter the list of results.
message PublicCloudVMQuery {
  // The name of the VMs.
  optional string name = 1 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // The labels each VM should have.
  optional fits.api.v1.Labels labels = 2;
}

// Request to get a VM by UUID.
message PublicCloudVMServiceGetRequest {
  // UUID of the VM to get.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // UUID of the project this VM belongs to.
  string project_uuid = 2 [(buf.validate.field).string.uuid = true];
}

// Response containing the requested VM.
message PublicCloudVMServiceGetResponse {
  // The VM.
  PublicCloudVM vm = 1;
}

// The request to create a new VM.
message PublicCloudVMServiceCreateRequest {
  // UUID of the project this VM belongs to.
  string project_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Name of the VM.
  string name = 2 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // Labels for this VM.
  fits.api.v1.Labels labels = 3;
  // Size of the VM.
  Size size = 4;
}

// The response when creating a new VM.
message PublicCloudVMServiceCreateResponse {
  // The VM just created.
  PublicCloudVM vm = 1;
}

// The request to list and filter VMs.
message PublicCloudVMServiceListRequest {
  // UUID of the project this VM belongs to.
  string project_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Paging details for the list request.
  fits.api.v1.Paging paging = 2;
  // Query defines how to filter the VMs.
  PublicCloudVMQuery query = 3;
}

// The response when listing VMs.
message PublicCloudVMServiceListResponse {
  // VMs is a list of filtered VMs resources.
  repeated PublicCloudVM vms = 1;
}

// The request to update a VM.
message PublicCloudVMServiceUpdateRequest {
  // UUID of the VM to update.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // UUID of the project this VM belongs to.
  string project_uuid = 2 [(buf.validate.field).string.uuid = true];
  // UpdateMeta contains the timestamp and strategy to be used in this update request.
  fits.api.v1.UpdateMeta update_meta = 3 [(buf.validate.field).required = true];

  // The labels to update.
  optional fits.api.v1.UpdateLabels labels = 4;

  // Name of the VM.
  optional string name = 5 [(buf.validate.field).string.(fits.api.v1.is_name) = true];

  // Size of the VM. The new size must be bigger or equal than before.
  // Downgrades are not possible.
  optional Size size = 6;
}

// The response when updating a VM.
message PublicCloudVMServiceUpdateResponse {
  // The updated VM.
  PublicCloudVM vm = 1;
}

// The request to delete a VM.
message PublicCloudVMServiceDeleteRequest {
  // UUID of the VM to delete.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // UUID of the project this VM belongs to.
  string project_uuid = 2 [(buf.validate.field).string.uuid = true];
}

// The response after deleting a VM.
// The VM is deleted immediately will not be able to be requested.
message PublicCloudVMServiceDeleteResponse {}

// Validation messages.
// The Validate* RPCs dry-run the upstream business rules without executing the
// operation; the mutation endpoints validate again before executing.

// Request to validate a VM create without creating anything.
message PublicCloudVMServiceValidateCreateRequest {
  // The create request to validate.
  PublicCloudVMServiceCreateRequest create = 1 [(buf.validate.field).required = true];
}

// Response for ValidateCreate; violations are returned as an InvalidArgument error.
message PublicCloudVMServiceValidateCreateResponse {}

// Request to validate a VM update without updating anything.
message PublicCloudVMServiceValidateUpdateRequest {
  // The update request to validate.
  PublicCloudVMServiceUpdateRequest update = 1 [(buf.validate.field).required = true];
}

// Response for ValidateUpdate; violations are returned as an InvalidArgument error.
message PublicCloudVMServiceValidateUpdateResponse {}

// Request to trigger the update of an existing MVM.
message MVMServiceUpdateRequest {
  // UUID of the MVM to update.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // UUID of the project this MVM belongs to.
  string project_uuid = 2 [(buf.validate.field).string.uuid = true];
  // Timestamp and strategy for this update.
  fits.api.v1.UpdateMeta update_meta = 3 [(buf.validate.field).required = true];
  // Customer reference for this operation, e.g. a ticket ID.
  string order_reference = 4 [(buf.validate.field).string.(fits.api.mvm.v1.is_order_reference) = true];
  // The labels to update.
  optional fits.api.v1.UpdateLabels labels = 5;
  // UUID of the new contact; unset keeps the current value.
  optional string contact_uuid = 6 [(buf.validate.field).string.uuid = true];
  // Number of CPU cores; unset keeps the current value.
  optional uint32 cpu = 7 [(buf.validate.field).uint32.(fits.api.mvm.v1.is_cpu_count) = true];
  // RAM in GiB; unset keeps the current value.
  optional uint32 ram_gb = 8 [(buf.validate.field).uint32.(fits.api.mvm.v1.is_ram_size) = true];
  // Reserved for service_class and availability, which will replace the
  // deprecated MVMService.UpdateServiceClass endpoint.
  reserved 9;
  reserved "service_class";
  reserved 10;
  reserved "availability";
}

// Response for Update; an empty response means the update was accepted.
// The update is applied asynchronously; poll Get until the state settles.
message MVMServiceUpdateResponse {}

// Request to validate a MVM update without updating anything.
message MVMServiceValidateUpdateRequest {
  // The update request to validate.
  MVMServiceUpdateRequest update = 1 [(buf.validate.field).required = true];
}

// Response for ValidateUpdate; violations are returned as an InvalidArgument error.
message MVMServiceValidateUpdateResponse {}


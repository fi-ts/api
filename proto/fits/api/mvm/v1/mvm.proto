syntax = "proto3";

package fits.api.mvm.v1;

import "buf/validate/validate.proto";
import "fits/api/mvm/v1/predefined_rules.proto";
import "fits/api/v1/common.proto";
import "fits/api/v1/predefined_rules.proto";

// MVMService provides managed VM (MVM) operations.
service MVMService {
  // Creates a new MVM.
  rpc Create(MVMServiceCreateRequest) returns (MVMServiceCreateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Validates a MVM create request without creating anything (dry-run).
  rpc ValidateCreate(MVMServiceValidateCreateRequest) returns (MVMServiceValidateCreateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Returns the MVM with the specified UUID.
  rpc Get(MVMServiceGetRequest) returns (MVMServiceGetResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Returns the list of all MVMs.
  rpc List(MVMServiceListRequest) returns (MVMServiceListResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Updates a MVM.
  rpc Update(MVMServiceUpdateRequest) returns (MVMServiceUpdateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Validates an Update request without changing anything.
  rpc ValidateUpdate(MVMServiceValidateUpdateRequest) returns (MVMServiceValidateUpdateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Deprecated: Updates the service class of a MVM.
  rpc UpdateServiceClass(MVMServiceUpdateServiceClassRequest) returns (MVMServiceUpdateServiceClassResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Deprecated: Validates an UpdateServiceClass request without changing anything.
  rpc ValidateUpdateServiceClass(MVMServiceValidateUpdateServiceClassRequest) returns (MVMServiceValidateUpdateServiceClassResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Deletes a MVM.
  rpc Delete(MVMServiceDeleteRequest) returns (MVMServiceDeleteResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Orders additional data disks for a MVM. System disks are ordered at
  // MVM creation and cannot be added later.
  rpc AddDisks(MVMServiceAddDisksRequest) returns (MVMServiceAddDisksResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Validates an AddDisks request without ordering anything.
  rpc ValidateAddDisks(MVMServiceValidateAddDisksRequest) returns (MVMServiceValidateAddDisksResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Changes the size or auto-extend behavior of an existing disk; see
  // DiskType for which operations apply per disk kind.
  rpc UpdateDisk(MVMServiceUpdateDiskRequest) returns (MVMServiceUpdateDiskResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Validates an UpdateDisk request without changing anything.
  rpc ValidateUpdateDisk(MVMServiceValidateUpdateDiskRequest) returns (MVMServiceValidateUpdateDiskResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Cancels a data disk. OS and system disks cannot be deleted.
  rpc DeleteDisk(MVMServiceDeleteDiskRequest) returns (MVMServiceDeleteDiskResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Orders an additional IP address for a MVM.
  rpc AddIPAddress(MVMServiceAddIPAddressRequest) returns (MVMServiceAddIPAddressResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Moves an IP address from one MVM to another.
  rpc MoveIPAddress(MVMServiceMoveIPAddressRequest) returns (MVMServiceMoveIPAddressResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Deletes an IP address from a MVM.
  rpc DeleteIPAddress(MVMServiceDeleteIPAddressRequest) returns (MVMServiceDeleteIPAddressResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Restarts a MVM.
  rpc Restart(MVMServiceRestartRequest) returns (MVMServiceRestartResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Reinstalls the operating system of a MVM.
  rpc Reinstall(MVMServiceReinstallRequest) returns (MVMServiceReinstallResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Validates a Reinstall request without reinstalling anything.
  rpc ValidateReinstall(MVMServiceValidateReinstallRequest) returns (MVMServiceValidateReinstallResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Creates a snapshot of a MVM.
  rpc AddSnapshot(MVMServiceAddSnapshotRequest) returns (MVMServiceAddSnapshotResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Deletes a snapshot of a MVM.
  rpc DeleteSnapshot(MVMServiceDeleteSnapshotRequest) returns (MVMServiceDeleteSnapshotResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Moves a MVM from one datacenter to another.
  rpc Move(MVMServiceMoveRequest) returns (MVMServiceMoveResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
}

// Availability specifies the availability level of a MVM; higher value = higher availability.
enum Availability {
  // AVAILABILITY_UNSPECIFIED is not specified.
  AVAILABILITY_UNSPECIFIED = 0 [(fits.api.v1.enum_string_value) = ""];
  // AVAILABILITY_V0 is availability level V0.
  AVAILABILITY_V0 = 1 [(fits.api.v1.enum_string_value) = "v0"];
  // AVAILABILITY_V1 is availability level V1.
  AVAILABILITY_V1 = 2 [(fits.api.v1.enum_string_value) = "v1"];
  // AVAILABILITY_V2 is availability level V2.
  AVAILABILITY_V2 = 3 [(fits.api.v1.enum_string_value) = "v2"];
  // AVAILABILITY_V3 is availability level V3.
  AVAILABILITY_V3 = 4 [(fits.api.v1.enum_string_value) = "v3"];
}

// ServiceClass specifies the service tier of a MVM; higher value = higher tier.
// Only certain combinations with Availability are valid.
enum ServiceClass {
  // SERVICE_CLASS_UNSPECIFIED is not specified.
  SERVICE_CLASS_UNSPECIFIED = 0 [(fits.api.v1.enum_string_value) = ""];
  // SERVICE_CLASS_SZ1 is service class SZ1.
  SERVICE_CLASS_SZ1 = 1 [(fits.api.v1.enum_string_value) = "sz1"];
  // SERVICE_CLASS_SZ2 is service class SZ2.
  SERVICE_CLASS_SZ2 = 2 [(fits.api.v1.enum_string_value) = "sz2"];
  // SERVICE_CLASS_SZ3 is service class SZ3.
  SERVICE_CLASS_SZ3 = 3 [(fits.api.v1.enum_string_value) = "sz3"];
}

// State specifies the current state of a MVM.
enum State {
  // STATE_UNSPECIFIED is not specified.
  STATE_UNSPECIFIED = 0 [(fits.api.v1.enum_string_value) = ""];
  // STATE_CREATING: the MVM hostname is reserved and provisioning has started.
  STATE_CREATING = 1 [(fits.api.v1.enum_string_value) = "creating"];
  // STATE_ACTIVE: the MVM is active.
  STATE_ACTIVE = 2 [(fits.api.v1.enum_string_value) = "active"];
  // STATE_UPDATING: there is an ongoing operation for the MVM.
  STATE_UPDATING = 3 [(fits.api.v1.enum_string_value) = "updating"];
  // STATE_DELETED: the MVM is deleted.
  STATE_DELETED = 4 [(fits.api.v1.enum_string_value) = "deleted"];
  // STATE_ERROR: the exact error status is derived from the request type.
  STATE_ERROR = 5 [(fits.api.v1.enum_string_value) = "error"];
}

// DiskType classifies a MVM disk by its lifecycle rules.
// The upstream (nulink) API returns every disk of a MVM, including the
// backend-provisioned OS disk, so that oversized OS disks stay billable.
//
// Lifecycle per kind:
//   - OS: provisioned by the backend and never part of create/add
//     requests; resizable via UpdateDisk, never deletable.
//   - SYSTEM: exactly one per MVM (drive letter F on Windows, mount point
//     /appdata on Linux), whose letter/mount point is fixed; must be
//     included in the create request; resizable via UpdateDisk, never
//     deletable.
//   - DATA: fully controllable (letter/mount point, size, auto-extend)
//     and deletable; may be included at creation or added later via
//     AddDisks.
//
// Whether auto-extend is supported for OS and SYSTEM disks is not yet
// known; only DATA disks are documented as supporting it.
//
// These rules are enforced by the upstream (nulink) API at creation and
// edit time (e.g. duplicate drive letters, deleting a system disk);
// fco-api does not re-validate them locally and surfaces upstream
// violations as InvalidArgument errors. Use the Validate* RPCs to
// pre-check a request against the upstream rules.
enum DiskType {
  // DISK_TYPE_UNSPECIFIED is not specified.
  DISK_TYPE_UNSPECIFIED = 0 [(fits.api.v1.enum_string_value) = ""];
  // DISK_TYPE_OS is the operating system disk; provisioned by the backend,
  // resizable, never deletable.
  DISK_TYPE_OS = 1 [(fits.api.v1.enum_string_value) = "os"];
  // DISK_TYPE_SYSTEM is the additional system disk (volume F on Windows,
  // /appdata on Linux); the letter/mount point is fixed, the size is
  // resizable, never deletable.
  DISK_TYPE_SYSTEM = 2 [(fits.api.v1.enum_string_value) = "system"];
  // DISK_TYPE_DATA is a user-managed data disk; fully controllable and
  // deletable.
  DISK_TYPE_DATA = 3 [(fits.api.v1.enum_string_value) = "data"];
}

// Disk configuration for a Linux MVM. See DiskType for the kinds of disks
// (os, system, data) and their lifecycle rules.
message LinuxDisk {
  // UUID of the disk; set for existing disks, unset for new ones.
  optional string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Label (name) of the disk.
  string label = 2 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // Size of the disk in GiB.
  uint64 size_gb = 3 [(buf.validate.field).uint64.(fits.api.mvm.v1.is_disk_size) = true];
  // Whether the disk grows automatically when space runs low.
  optional bool auto_extend = 4;
  // Mount point (e.g. "/data/app"). Fixed to "/appdata" for the system disk;
  // any absolute path allowed by the upstream for data disks.
  optional string mount_point = 5 [(buf.validate.field).string.(fits.api.mvm.v1.is_mount_point) = true];
  // Kind of the disk; determines which operations are allowed on it.
  // Provided by the client in create/add requests and populated by the
  // API in responses.
  optional DiskType disk_type = 6 [(buf.validate.field).enum.defined_only = true];
}

// Disk configuration for a Windows MVM. See DiskType for the kinds of
// disks (os, system, data) and their lifecycle rules.
message WindowsDisk {
  // UUID of the disk; set for existing disks, unset for new ones.
  optional string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Label (name) of the disk.
  string label = 2 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // Size of the disk in GiB.
  uint64 size_gb = 3 [(buf.validate.field).uint64.(fits.api.mvm.v1.is_disk_size) = true];
  // Whether the disk grows automatically when space runs low.
  optional bool auto_extend = 4;
  // Drive letter (e.g. "G"). Fixed to "F" for the system disk; any letter
  // allowed by the upstream for data disks.
  optional string drive_letter = 5 [(buf.validate.field).string.(fits.api.mvm.v1.is_drive_letter) = true];
  // Kind of the disk; determines which operations are allowed on it.
  // Provided by the client in create/add requests and populated by the
  // API in responses.
  optional DiskType disk_type = 6 [(buf.validate.field).enum.defined_only = true];
}

// Disk contains either a Windows or Linux disk.
message Disk {
  // OS-specific disk specification; must match the MVM's OS type.
  oneof disk {
    option (buf.validate.oneof).required = true;
    // Linux disk.
    LinuxDisk linux = 4;
    // Windows disk.
    WindowsDisk windows = 5;
  }
}

// Linux-specific MVM details.
message LinuxDetails {
  // Disks configured on the Linux MVM.
  repeated LinuxDisk disks = 1;
  // UUID of the LDAP directory the MVM is integrated with.
  string ldap_uuid = 2 [(buf.validate.field).string.uuid = true];
  // Linux-specific FQDN, derived from the name at creation or generated by the backend.
  string ldap_fqdn = 3 [(buf.validate.field).string.(fits.api.mvm.v1.is_fqdn) = true];
}

// Windows-specific MVM details.
message WindowsDetails {
  // Disks configured on the Windows MVM.
  repeated WindowsDisk disks = 1;
  // UUID of the Windows domain the MVM has joined.
  string domain_uuid = 2 [(buf.validate.field).string.uuid = true];
  // Windows-specific FQDN, derived from the name at creation or generated by the backend.
  string domain_fqdn = 3 [(buf.validate.field).string.(fits.api.mvm.v1.is_fqdn) = true];
}

// An IPv4 address of a MVM. IPv4 only; IPv6 is not yet supported.
message IPAddress {
  // UUID of this IP address.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // The IPv4 address.
  string ip_address = 2 [(buf.validate.field).string.ipv4 = true];
  // The network interface this IP address is bound to.
  // Unset for additional IP addresses that share an existing interface;
  // such addresses can be deleted via DeleteIPAddress.
  optional NetworkInterface network_interface = 3;
}

// A network interface of a MVM.
message NetworkInterface {
  // UUID of the VLAN.
  string vlan_uuid = 1 [(buf.validate.field).string.uuid = true];
  // MAC address of this interface.
  string mac_address = 2 [(buf.validate.field).string.(fits.api.v1.mac_address) = true];
}

// The InitialIPAddress needs to be provided at creation of a MVM.
// It provides the UUID of the target VLAN for the MVM's first IP address.
// The created MVM comes with an IPAddress on a network interface connected
// to this VLAN.
message InitialIPAddress {
  // UUID of the VLAN.
  string vlan_uuid = 1 [(buf.validate.field).string.uuid = true];
}

// The status of the MVM.
message Status {
  // State of the MVM.
  State state = 1 [(buf.validate.field).enum.defined_only = true];
  // Additional information about the current status.
  string info = 2 [(buf.validate.field).string.(fits.api.v1.is_description) = true];
}

// Backup configuration of a MVM.
// Modeled as a message so that backup options (e.g. retention or schedule)
// can be added later without breaking the API.
message Backup {
  // Whether backup is enabled.
  bool enabled = 1;
}

// Encryption configuration of a MVM.
// Modeled as a message so that encryption options (e.g. a key reference)
// can be added later without breaking the API.
message Encryption {
  // Whether the disks of the MVM are encrypted.
  bool enabled = 1;
}

// ManagedVM is a managed VM instance as returned by the API.
message ManagedVM {
  // UUID of this MVM.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Metadata for this MVM.
  // TODO: dates are available in the nulink db but not passed through yet.
  fits.api.v1.Meta meta = 2;
  // FQDN of the MVM, derived from the name at creation or generated by the backend.
  string fqdn = 3 [(buf.validate.field).string.(fits.api.mvm.v1.is_fqdn) = true];
  // Tenant this MVM belongs to.
  string tenant = 4 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // UUID of the project this MVM belongs to.
  string project_uuid = 5 [(buf.validate.field).string.uuid = true];
  // UUID of the OS image installed on the MVM; resolve the title via the OS endpoint.
  string os_uuid = 6 [(buf.validate.field).string.uuid = true];
  // UUID of the datacenter location.
  string location_uuid = 7 [(buf.validate.field).string.uuid = true];
  // UUID of the contact person responsible for this MVM.
  string contact_uuid = 8 [(buf.validate.field).string.uuid = true];
  // Number of CPU cores.
  uint32 cpu = 9 [(buf.validate.field).uint32.(fits.api.mvm.v1.is_cpu_count) = true];
  // RAM in GiB.
  uint32 ram_gb = 10 [(buf.validate.field).uint32.(fits.api.mvm.v1.is_ram_size) = true];
  // Backup configuration of the MVM.
  Backup backup = 11;
  // Encryption configuration of the MVM.
  Encryption encryption = 12;
  // Status of the MVM.
  Status status = 13;
  // Availability level.
  Availability availability = 14 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Service class.
  ServiceClass service_class = 15 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // OS-specific configuration.
  oneof details {
    option (buf.validate.oneof).required = true;
    // Windows-specific settings (domain + disks).
    WindowsDetails windows_details = 16;
    // Linux-specific settings (LDAP + disks).
    LinuxDetails linux_details = 17;
  }
  // IP addresses attached to the MVM (IPv4 only).
  repeated IPAddress ip_addresses = 18;
  // Customer reference provided by the user, e.g. a ticket ID.
  string order_reference = 19 [(buf.validate.field).string.(fits.api.mvm.v1.is_order_reference) = true];
  // Snapshots of the MVM.
  repeated Snapshot snapshots = 20;
}

// A snapshot of a MVM.
message Snapshot {
  // UUID of this snapshot.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Name of the snapshot; alphanumeric only.
  string name = 2 [(buf.validate.field).string.(fits.api.mvm.v1.is_snapshot_name) = true];
}

// Request to get a MVM by UUID.
message MVMServiceGetRequest {
  // UUID of the MVM.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // UUID of the project this MVM belongs to.
  string project_uuid = 2 [(buf.validate.field).string.uuid = true];
}

// Response containing the requested MVM.
message MVMServiceGetResponse {
  // The MVM.
  ManagedVM mvm = 1;
}

// Request to list MVMs.
message MVMServiceListRequest {
  // UUID of the project to list MVMs for.
  string project_uuid = 1 [(buf.validate.field).string.uuid = true];
}

// Response containing the list of MVMs.
message MVMServiceListResponse {
  // The MVM instances.
  repeated ManagedVM mvms = 1;
}

// Windows-specific create request parts.
message MVMServiceCreateWindowsRequest {
  // UUID of the Windows domain the MVM should join.
  string domain_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Disks for the Windows MVM, excluding the OS disk; must contain exactly
  // one system disk plus any number of data disks (see DiskType).
  repeated WindowsDisk disks = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.(fits.api.mvm.v1.is_disk_count) = true
  ];
}

// Linux-specific create request parts.
message MVMServiceCreateLinuxRequest {
  // UUID of the LDAP directory the MVM should integrate with.
  string ldap_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Disks for the Linux MVM, excluding the OS disk; must contain exactly
  // one system disk plus any number of data disks (see DiskType).
  repeated LinuxDisk disks = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.(fits.api.mvm.v1.is_disk_count) = true
  ];
}

// Request to create a new MVM instance.
message MVMServiceCreateRequest {
  // UUID of the project this MVM belongs to.
  string project_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Required 4-character code (digits and letters); the FQDN is derived from it.
  string name_code = 2 [(buf.validate.field).string.(fits.api.mvm.v1.is_name_code) = true];
  // UUID of the operating system image to install.
  string os_uuid = 3 [(buf.validate.field).string.uuid = true];
  // UUID of the datacenter location; the MVM is scheduled into one data center within it.
  string location_uuid = 4 [(buf.validate.field).string.uuid = true];
  // UUID of the contact person responsible for this MVM.
  string contact_uuid = 5 [(buf.validate.field).string.uuid = true];
  // Number of CPU cores.
  uint32 cpu = 6 [(buf.validate.field).uint32.(fits.api.mvm.v1.is_cpu_count) = true];
  // RAM in GiB.
  uint32 ram_gb = 7 [(buf.validate.field).uint32.(fits.api.mvm.v1.is_ram_size) = true];
  // Customer reference for this operation, e.g. a ticket ID.
  string order_reference = 8 [(buf.validate.field).string.(fits.api.mvm.v1.is_order_reference) = true];
  // Optional key-value labels for this MVM.
  fits.api.v1.Labels labels = 9;
  // Backup configuration of the MVM.
  Backup backup = 10 [(buf.validate.field).required = true];
  // Encryption configuration of the MVM.
  Encryption encryption = 11 [(buf.validate.field).required = true];
  // Availability level.
  Availability availability = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Service class; only certain combinations with availability are valid.
  ServiceClass service_class = 13 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // OS type and its configuration.
  oneof mvm_type {
    option (buf.validate.oneof).required = true;
    // Windows-specific settings (domain + disks).
    MVMServiceCreateWindowsRequest windows = 14;
    // Linux-specific settings (LDAP + disks).
    MVMServiceCreateLinuxRequest linux = 15;
  }
  // Provides the target VLAN for the initial IP address.
  InitialIPAddress initial_ip_address = 16 [(buf.validate.field).required = true];
}

// Response for MVM create requests.
message MVMServiceCreateResponse {
  // UUID of the created MVM.

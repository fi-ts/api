syntax = "proto3";

package fits.api.mvm.v1;

import "buf/validate/validate.proto";
import "fits/api/v1/common.proto";
import "fits/api/v1/predefined_rules.proto";

// StageService lists available stages.
service StageService {
  // Returns a list of all available stages.
  rpc List(StageServiceListRequest) returns (StageServiceListResponse) {
    option (fits.api.v1.visibility) = VISIBILITY_SELF;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
}

// Stages a MVM can belong to.
message Stage {
  // UUID of this Stage.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Title of the Stage.
  string title = 2 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
}

// StageServiceListRequest is the request payload for a stage list request.
message StageServiceListRequest {}

// StageServiceListResponse is the response payload for a stage list request.
message StageServiceListResponse {
  // The available stages.
  repeated Stage stages = 1;
}

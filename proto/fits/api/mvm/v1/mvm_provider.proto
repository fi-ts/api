syntax = "proto3";

package fits.api.mvm.v1;

import "fits/api/mvm/v1/mvm.proto";
import "fits/api/v1/common.proto";

// ProviderMVMService offers MVM operations in the provider context.
service ProviderMVMService {
  // Create makes a new MVM and lets the operator set its billing fields.
  rpc Create(ProviderMVMServiceCreateRequest) returns (ProviderMVMServiceCreateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
    option (fits.api.v1.role_context) = ROLE_CONTEXT_PROVIDER;
  }
}

// Request to create an MVM in the provider context.
message ProviderMVMServiceCreateRequest {
  // The public create request.
  MVMServiceCreateRequest request = 1;
  // Determines if the MVM is billable.
  bool billable = 2;
}

// Response for a provider-context MVM create.
message ProviderMVMServiceCreateResponse {
  // The public create response.
  MVMServiceCreateResponse response = 1;
}

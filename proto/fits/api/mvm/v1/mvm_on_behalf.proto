syntax = "proto3";

package fits.api.mvm.v1;

import "fits/api/mvm/v1/mvm.proto";
import "fits/api/v1/common.proto";
import "google/protobuf/timestamp.proto";

// OnBehalfMVMService offers MVM operations on behalf of a customer tenant.
service OnBehalfMVMService {
  // Create makes a new MVM and lets the operator set its billing fields.
  rpc Create(OnBehalfMVMServiceCreateRequest) returns (OnBehalfMVMServiceCreateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_ADMIN;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
    option (fits.api.v1.role_context) = ROLE_CONTEXT_ON_BEHALF;
  }
}

// Request to create an MVM on behalf of a customer tenant.
message OnBehalfMVMServiceCreateRequest {
  // The public create request.
  MVMServiceCreateRequest request = 1;
  // Determines if the MVM is billable.
  bool billable = 2;
  // The start date when the MVM will be billable.
  optional google.protobuf.Timestamp billable_from = 3;
}

// Response for an on-behalf MVM create.
message OnBehalfMVMServiceCreateResponse {
  // The public create response.
  MVMServiceCreateResponse response = 1;
}

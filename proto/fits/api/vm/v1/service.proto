syntax = "proto3";

package fits.api.vm.v1;

import "buf/validate/validate.proto";
import "fits/api/v1/common.proto";

// ServiceService TODO what is a service?
service ServiceService {
  // Returns a list of all services.
  rpc List(ServiceServiceListRequest) returns (ServiceServiceListResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_OWNER;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
}

// TODO what is a service?
message Service {
  // Uuid of this Service
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // title of the Service
  string title = 2;
  // type NucleusDBServices struct {
  // 	ServiceTitle string `json:"service_title"`
  // 	ServiceUuid  string `json:"service_uuid"`
  // }
}

// ServiceServiceListRequest is the request payload for a service list request.
// The upstream nulink API accepts no body or parameters, so this is intentionally empty.
message ServiceServiceListRequest {}

// ServiceServiceListResponse is the response payload for a service list request
message ServiceServiceListResponse {
  // The available services
  repeated Service services = 1;
}

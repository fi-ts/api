syntax = "proto3";

package fits.api.vm.v1;

import "buf/validate/validate.proto";
import "fits/api/v1/common.proto";
import "fits/api/v1/predefined_rules.proto";
import "fits/api/vm/v1/vlan.proto";

// VMService provides VM CRUD perations.
service VMService {
  // Returns the VM with the specified UUID.
  rpc Get(VMServiceGetRequest) returns (VMServiceGetResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_OWNER;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Creates a new VM.
  rpc Create(VMServiceCreateRequest) returns (VMServiceCreateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_OWNER;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Updates a VM.
  rpc Update(VMServiceUpdateRequest) returns (VMServiceUpdateResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_OWNER;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
  // Returns the list of all VMs.
  rpc List(VMServiceListRequest) returns (VMServiceListResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_OWNER;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
  // Deletes a VM.
  rpc Delete(VMServiceDeleteRequest) returns (VMServiceDeleteResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_OWNER;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.auditing) = AUDITING_INCLUDED;
  }
}

// VM Instance Messages
// A VM instance as returned by the API.
message VMInstance {
  // UUID of this VM.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Metadata for this VM.
  // TODO dates are available in the nulink db, but not passed through yet.
  fits.api.v1.Meta meta = 2;
  // FQDN of the VM. Derived from the optional name set at creation,
  // or generated by the backend if none was provided.
  string fqdn = 3 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // Tenant this VM belongs to.
  string tenant = 4 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // UUID of the project this VM belongs to.
  string project_uuid = 5 [(buf.validate.field).string.uuid = true];
  // UUID of the operating system image installed on the VM.
  // Resolve the human-readable title via the OS endpoint.
  string os_uuid = 6 [(buf.validate.field).string.uuid = true];
  // UUID of the datacenter location.
  // The VM is automatically scheduled into one pod within the chosen location;
  // users select the city but not the specific datacenter.
  string location_uuid = 7 [(buf.validate.field).string.uuid = true];
  // TODO: Contact UUID – not yet implemented; open discussion with FCN (#23).
  string contact_uuid = 8 [(buf.validate.field).string.uuid = true];

  // Number of CPU cores.
  uint32 cpu = 9;
  // RAM in GB.
  uint32 ram = 10;

  // Internal reference number provided by the user, e.g. a ticket ID.
  string order_number = 11;
  // Whether the order was placed by FITS (true) or self-service by the user (false).
  bool contract = 12;

  // Whether backup is enabled.
  bool backup = 13;
  // Availability level: v0, v1, v2, v3 (higher value = higher availability).
  string availability = 14;
  // Service class: sz1, sz2, sz3 (higher value = higher tier).
  string serviceclass = 15;

  // Status of the ongoing operation.
  string status = 16;
  // Additional information about the current status.
  string status_info = 17;

  // OS-specific configuration. Exactly one must be set.
  oneof details {
    option (buf.validate.oneof).required = true;
    // Windows-specific settings (domain + disks).
    WindowsDetails windows_details = 18;
    // Linux-specific settings (LDAP + disks).
    LinuxDetails linux_details = 19;
  }

  // Network interfaces attached to the VM (IPv4 only).
  repeated NetworkInterface interfaces = 20;
  // VLAN the VM is attached to.
  Vlan vlan = 21;
}

// Linux-specific VM details.
message LinuxDetails {
  // Disks configured on the Linux VM.
  repeated LinuxDisk disks = 1;
  // UUID of the LDAP directory the VM is integrated with.
  string ldap_uuid = 2 [(buf.validate.field).string.uuid = true];
  // Linux-specific FQDN. Derived from the optional name set at creation,
  // or generated by the backend if none was provided.
  string ldap_fqdn = 3 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
}

// Windows-specific VM details.
message WindowsDetails {
  // Disks configured on the Windows VM.
  repeated WindowsDisk disks = 1;
  // UUID of the Windows domain the VM has joined.
  string domain_uuid = 2 [(buf.validate.field).string.uuid = true];
  // Windows-specific FQDN. Derived from the optional name set at creation,
  // or generated by the backend if none was provided.
  string domain_fqdn = 3 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
}

// A network interface of a VM. IPv4 only; IPv6 is not yet supported.
message NetworkInterface {
  // UUID of this interface.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // IPv4 address assigned to this interface.
  string ipaddress = 2 [(buf.validate.field).string.(fits.api.v1.is_ip_or_hostname) = true];
  // MAC address of this interface.
  string macaddress = 3; // TODO validation
}
// Service messages

// VMServiceGetRequest TODO
message VMServiceGetRequest {
  // Uuid of this VM
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // Project where this VM belongs to
  string project = 2 [(buf.validate.field).string.uuid = true];
}

// VMServiceGetResponse TODO
message VMServiceGetResponse {
  // The VM
  VMInstance vm = 1;
}
// Windows-specific create request parts.
message VMServiceCreateWindowsRequest {
  // UUID of the Windows domain the VM should join. Required.
  string domain_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Disk configuration for the Windows VM.
  WindowsDisk disk = 2;
}

// Linux-specific create request parts.
message VMServiceCreateLinuxRequest {
  // UUID of the LDAP directory the VM should integrate with. Required.
  string ldap_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Disk configuration for the Linux VM.
  LinuxDisk disk = 2;
}

// Request to create a new VM instance.
message VMServiceCreateRequest {
  // UUID of the project this VM belongs to. Required.
  string project_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Optional name for the VM. The FQDN is derived from this value.
  optional string name = 2 [(buf.validate.field).string.(fits.api.v1.is_name) = true];
  // UUID of the operating system image to install. Required.
  string os_uuid = 3 [(buf.validate.field).string.uuid = true];
  // UUID of the VLAN network to attach the VM to. Required.
  // Obtainable via the VLAN list endpoint.
  string vlan_uuid = 4 [(buf.validate.field).string.uuid = true];
  // UUID of the datacenter location. Required.
  // The VM is automatically scheduled into one data center within the chosen location;
  // users select the city but not the specific datacenter.
  string location_uuid = 5 [(buf.validate.field).string.uuid = true];
  // TODO: Contact UUID – open discussion with FCN on how to model responsible contacts.
  // GDPR considerations pending. May become a dedicated /contact endpoint.
  string contact_uuid = 6 [(buf.validate.field).string.uuid = true];
  // Number of CPU cores.
  uint32 cpu = 7;
  // RAM in GB. Must be a power of 2.
  uint32 ram = 8;
  // Internal reference number provided by the user, e.g. a ticket ID. Free text. Required.
  string order_number = 9;
  // Optional key-value labels for accounting purposes
  // (e.g. contract number, transaction number, technical key, accounting key).
  fits.api.v1.Labels labels = 10;
  // Whether backup is enabled. Simple on/off toggle; no distinct backup plans. Required.
  bool backup = 11;
  // Availability level: v0, v1, v2, v3 (higher value = higher availability). Required.
  string availability = 12;
  // Service class: sz1, sz2, sz3 (higher value = higher tier). Required.
  // Only certain combinations with availability are valid; enforced by the backend.
  string serviceclass = 13;
  // Specifies the OS type and its associated configuration. Exactly one must be set.
  oneof vmtype {
    option (buf.validate.oneof).required = true;
    // Windows-specific settings (domain + disk).
    VMServiceCreateWindowsRequest windows = 14;
    // Linux-specific settings (LDAP + disk).
    VMServiceCreateLinuxRequest linux = 15;
  }
}

// Disk configuration for a Linux VM.
message LinuxDisk {
  // If true, the disk grows automatically when space runs low.
  bool auto_extend = 1;
  // Size of the disk in GB.
  optional uint64 size_in_gb = 2;
  // Label (name) of the disk.
  string label = 4;
  // Filesystem path where this disk should be mounted (e.g. "/data").
  optional string mount_point = 5;
}

// Disk configuration for a Windows VM.
message WindowsDisk {
  // If true, the disk grows automatically when space runs low.
  bool auto_extend = 1;
  // Size of the disk in GB.
  optional uint64 size_in_gb = 2;
  // Drive letter assigned to this disk (e.g. "D").
  optional string driveletter = 3;
  // Label (name) of the disk.
  string label = 4;
}

// VMServiceCreateResponse TODO
message VMServiceCreateResponse {}

// VMServiceUpdateRequest TODO
message VMServiceUpdateRequest {
  // Project of the VM
  string project_uuid = 1 [(buf.validate.field).string.uuid = true];

  // UpdateMeta contains the timestamp and strategy to be used in this update request.
  fits.api.v1.UpdateMeta update_meta = 2 [(buf.validate.field).required = true];
}

// VMServiceUpdateResponse TODO
message VMServiceUpdateResponse {}

// VMServiceListRequest
message VMServiceListRequest {
  // Tenant of the VM
  optional string tenant = 1;
  // Project of the VM
  optional string project_uuid = 2 [(buf.validate.field).string.uuid = true];
}

// VMServiceListResponse
message VMServiceListResponse {
  // List of VM instances
  repeated VMInstance vms = 1;
}

// VMServiceDeleteRequest TODO
message VMServiceDeleteRequest {
  // Project of the VM
  string project = 1 [(buf.validate.field).string.uuid = true];
}

// VMServiceDeleteResponse TODO
message VMServiceDeleteResponse {}

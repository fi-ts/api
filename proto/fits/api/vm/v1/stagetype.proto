syntax = "proto3";

package fits.api.vm.v1;

import "buf/validate/validate.proto";
import "fits/api/v1/common.proto";

// StageTypeService lists stage types available for VM instances.
service StageTypeService {
  // Returns a list of all stage types available for a tenant.
  rpc List(StageTypeServiceListRequest) returns (StageTypeServiceListResponse) {
    option (fits.api.v1.project_roles) = PROJECT_ROLE_OWNER;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_EDITOR;
    option (fits.api.v1.project_roles) = PROJECT_ROLE_VIEWER;
    option (fits.api.v1.auditing) = AUDITING_EXCLUDED;
  }
}

// TODO what is a stage type?
// Maps to the upstream NucleusDBStageTypes model.
// TODO evaluate whether the uuid is really optional; the upstream API spec does not
// make this clear, so we validate it strictly for now.
message StageType {
  // Uuid of this stage type
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // title of the stage type
  string title = 2;
  // type NucleusDBStageTypes struct {
  // 	StageTypeTitle string              `json:"stage_type_title"`
  // 	StageTypeUuid  *openapi_types.UUID `json:"stage_type_uuid,omitempty"`
  // }
}

// StageTypeServiceListRequest is the request payload for a stage type list request.
// Maps to the upstream TenantInputModel.
message StageTypeServiceListRequest {
  // Tenant to list available stage types for
  string tenant_uuid = 1 [(buf.validate.field).string.uuid = true];
  // Note: the upstream model also has a requested_by field, which is intentionally
  // omitted here because it is added by the auth layer from the request context.
}

// StageTypeServiceListResponse is the response payload for a stage type list request
message StageTypeServiceListResponse {
  // The available stage types
  repeated StageType stagetypes = 1;
  // Validation errors returned by the upstream API when the request is rejected (HTTP 422)
  // TODO this is just a test
  repeated fits.api.v1.ValidationError validation_errors = 2;
}
